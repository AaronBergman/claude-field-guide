name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install extra awks and shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk mawk dash busybox

      - name: Install extra awks and shells (macOS)
        if: runner.os == 'macOS'
        run: brew install gawk mawk dash || true

      - name: Hook tests
        run: python3 tests/test_hooks.py || python tests/test_hooks.py

      - name: Quote checker tests
        run: python3 tests/test_quotes.py || python tests/test_quotes.py

      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: 22

      - name: Validate manifests
        if: runner.os != 'Windows'
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
          claude plugin validate --strict .
          for p in plugins/*; do claude plugin validate --strict "$p"; done
